<!DOCTYPE html>
<html>
    <head>
        <style>
        .box {
            display: grid;
            gap: 10px;
            border: 2px dashed gray;
            margin-bottom: 30px;
        }

        .fill { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        .fit  { grid-template-columns: repeat(auto-fit,  minmax(100px, 1fr)); }

        .item {
            background: tomato;
            color: white;
            padding: 20px;
            text-align: center;
        }
        </style>
    </head>
    <body>

        <h3>auto-fill</h3>
        <div class="box fill">
        <div class="item">1</div>
        <div class="item">2</div>
        </div>

        <h3>auto-fit</h3>
        <div class="box fit">
        <div class="item">1</div>
        <div class="item">2</div>
        </div>

    </body>
</html>
