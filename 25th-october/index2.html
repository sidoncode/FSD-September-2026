<!DOCTYPE html>

<html>
    <head>
        <style>
            /* :hover- when the mouse is over the button */
            /* button css props define */
            button{
                padding: 10px 20px;
                background: #4f46e5;
                color: white;
                border: none;
                border-radius: 6px;
            }

            /* button css props: specifically add */
            button:hover{
                background: #3730a3;
            }
            
            /* focus - when the input is selected */
            input {
                    padding: 8px;
                    border: 2px solid #ccc;
                    border-radius: 6px;
                    }
                    input:focus {
                    border-color: #4f46e5;
                    }

                    /* :checked - when the checkbox is ticked */
                    input[type="checkbox"]:checked + span {
                    color: #16a34a;
                    font-weight: bold;
                }

        </style>
    </head>

    <body>
        <button>Hover over me</button>
        <br><br>

        <input type="text" placeholder="Type something...">
        <br><br>
        
        <label>
            <input type="checkbox"> <span>Tick Me</span>
        </label>
    </body>


</html>
