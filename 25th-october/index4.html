<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                    height: 100vh;
                    margin: 0;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    background: linear-gradient(to right, #04f90d9c, #ff5900);
                }

                .glass {
                    width: 250px;
                    padding: 20px;
                    border-radius: 15px;
                    background: rgba(255, 255, 255, 0.25);
                    backdrop-filter: blur(10px);
                    color: white;
                    text-align: center;
            }

        </style>
    </head>

    <body>
        <div class="glass">
            <h2>Hello</h2>
            <p>I am a glass Card.</p>
    </body>

</html>
