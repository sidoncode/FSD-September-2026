<!DOCTYPE html>

<html>

    <head>
        <style>
            .button {
                background-color: steelblue;
                color: white;
                padding: 15px 30px;
                border: none;
                font-size: 18px;
                cursor: pointer;

                /* Transition effect */
                transition: background-color 1s;
            }
            
            button:hover {
                background-color: orange;
            }

        </style>
    </head>
    <body>
        <h2>Css transition Demo</h2>
        <p>Move your mouse over the button</p>
        <button>Hover me!</button>
    </body>


</html>
